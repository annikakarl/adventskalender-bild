<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Malen nach Zahlen für dich ❤️</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        h2 {
            margin: 5px 0 5px 0;
            font-size: 1.2rem;
            color: #2c3e50;
            text-align: center;
        }

        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }

        #game-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 15px;
            max-width: 100%;
            overflow-x: auto; /* Falls das Raster breiter wird */
        }

        /* Das Raster (hier am Beispiel 15x15 für mehr Details) */
        .grid {
            display: grid;
            grid-template-columns: repeat(15, 26px); /* 15 Spalten à 26px */
            gap: 2px;
        }

        .pixel {
            width: 26px;
            height: 26px;
            background-color: #e0e0e0;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        .pixel:active {
            transform: scale(0.9);
        }

        /* Horizontal scrollbarer Farbpaletten-Bereich */
        #palette-container {
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        /* Scrollbar optisch etwas verfeinern */
        #palette-container::-webkit-scrollbar {
            height: 6px;
        }
        #palette-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .palette-btn {
            flex: 0 0 auto; /* Verhindert das Schrumpfen der Buttons */
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            font-size: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .palette-btn.selected {
            border-color: #2c3e50;
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        /* Gewinn-Nachricht */
        #success-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 300px;
        }
    </style>
</head>
<body>

    <h2>🎨 Malen nach Zahlen</h2>
    <div class="hint">Wähle unten eine Farbe (wische zum Scrollen) und tippe auf die passenden Felder!</div>

    <div id="game-container">
        <div id="pixel-grid" class="grid"></div>
    </div>

    <div id="palette-container"></div>

    <div id="success-message">
        🎉 Wundervoll! Du hast es geschafft!<br>
        <span style="font-size: 0.9rem; font-weight: normal; display: block; margin-top: 5px;">
            "Ich freue mich auf heute Abend mit dir! ❤️"
        </span>
    </div>

    <script>
        // Farbdefinitionen (Beispielhaft bis Farbe 50 erweiterbar)
        const colors = {
            1:  { hex: '#1e293b' },
            2:  { hex: '#334155' },
            3:  { hex: '#475569' },
            4:  { hex: '#64748b' },
            5:  { hex: '#94a3b8' },
            6:  { hex: '#cbd5e1' },
            7:  { hex: '#f8fafc' },
            8:  { hex: '#ef4444' },
            9:  { hex: '#dc2626' },
            10: { hex: '#b91c1c' },
            11: { hex: '#f97316' },
            12: { hex: '#ea580c' },
            13: { hex: '#f59e0b' },
            14: { hex: '#d97706' },
            15: { hex: '#eab308' },
            16: { hex: '#ca8a04' },
            17: { hex: '#84cc16' },
            18: { hex: '#65a30d' },
            19: { hex: '#22c55e' },
            20: { hex: '#16a34a' },
            21: { hex: '#15803d' },
            22: { hex: '#10b981' },
            23: { hex: '#059669' },
            24: { hex: '#14b8a6' },
            25: { hex: '#0d9488' },
            26: { hex: '#06b6d4' },
            27: { hex: '#0891b2' },
            28: { hex: '#0ea5e9' },
            29: { hex: '#0284c7' },
            30: { hex: '#3b82f6' },
            31: { hex: '#2563eb' },
            32: { hex: '#1d4ed8' },
            33: { hex: '#6366f1' },
            34: { hex: '#4f46e5' },
            35: { hex: '#8b5cf6' },
            36: { hex: '#7c3aed' },
            37: { hex: '#a855f7' },
            38: { hex: '#9333ea' },
            39: { hex: '#d946ef' },
            40: { hex: '#c026d3' },
            41: { hex: '#ec4899' },
            42: { hex: '#db2777' },
            43: { hex: '#f43f5e' },
            44: { hex: '#e11d48' },
            45: { hex: '#78716c' },
            46: { hex: '#57534e' },
            47: { hex: '#44403c' },
            48: { hex: '#292524' },
            49: { hex: '#1c1917' },
            50: { hex: '#0f172a' }
        };

        // Beispiel-Muster (15x15 = 225 Pixel, hier mit Nummern 1 bis 50 gefüllt)
        const pattern = [
             7,  7,  7,  7,  7,  1,  2,  3,  4,  7,  7,  7,  7,  7,  7,
             7,  7,  7,  7,  1,  8,  9, 10,  2,  4,  7,  7,  7,  7,  7,
             7,  7,  7,  1,  8, 11, 12, 13,  9,  3,  4,  7,  7,  7,  7,
             7,  7,  1,  8, 11, 14, 15, 16, 12, 10,  2,  4,  7,  7,  7,
             7,  1,  8, 11, 14, 17, 18, 19, 15, 13,  9,  3,  4,  7,  7,
             7,  2,  9, 12, 15, 18, 20, 21, 19, 16, 14, 10,  2,  4,  7,
             7,  3, 10, 13, 16, 19, 21, 22, 20, 17, 15, 11,  3,  5,  7,
             7,  4,  2, 14, 17, 20, 22, 23, 21, 18, 16, 12,  4,  6,  7,
             7,  7,  4,  3, 18, 21, 23, 24, 22, 19, 17, 13,  5,  7,  7,
             7,  7,  7,  4,  3, 22, 24, 25, 23, 20, 18, 14,  6,  7,  7,
             7,  7,  7,  7,  4,  3, 25, 26, 24, 21, 19, 15,  7,  7,  7,
             7,  7,  7,  7,  7,  4,  3, 27, 25, 22, 20, 16,  7,  7,  7,
             7,  7,  7,  7,  7,  7,  4,  3, 26, 23, 21, 17,  7,  7,  7,
             7,  7,  7,  7,  7,  7,  7,  4,  3, 24, 22, 18,  7,  7,  7,
             7,  7,  7,  7,  7,  7,  7,  7,  4,  3, 23, 19,  7,  7,  7
        ];

        let selectedColor = null;
        let correctPixelsCount = 0;
        const totalPixels = pattern.length;

        const gridEl = document.getElementById('pixel-grid');
        const paletteEl = document.getElementById('palette-container');
        const successMsg = document.getElementById('success-message');

        // Palette generieren
        for (let [num, data] of Object.entries(colors)) {
            const btn = document.createElement('div');
            btn.className = 'palette-btn';
            btn.style.backgroundColor = data.hex;
            btn.innerText = num;
            btn.dataset.colorNum = num; // Wichtig, um den Button später zu finden

            btn.onclick = () => {
                document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedColor = parseInt(num);
            };
            paletteEl.appendChild(btn);
        }

        // Pixel-Grid generieren
        pattern.forEach((targetColor, index) => {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            pixel.innerText = targetColor;
            pixel.dataset.target = targetColor;
            pixel.dataset.filled = "false";

            pixel.onclick = () => {
                if (selectedColor === null) {
                    return;
                }

                if (selectedColor === targetColor && pixel.dataset.filled === "false") {
                    pixel.style.backgroundColor = colors[targetColor].hex;
                    pixel.innerText = "";
                    pixel.dataset.filled = "true";
                    correctPixelsCount++;

                    // Prüfen, ob noch Pixel mit dieser Farbe übrig sind
                    const remainingForThisColor = pattern.filter((val, idx) => {
                        return val === selectedColor && gridEl.children[idx].dataset.filled === "false";
                    }).length;

                    // Wenn Farbe komplett aufgebraucht ist -> Button ausblenden
                    if (remainingForThisColor === 0) {
                        const btnToHide = paletteEl.querySelector(`[data-color-num="${selectedColor}"]`);
                        if (btnToHide) {
                            btnToHide.style.display = 'none';
                        }
                        selectedColor = null; // Auswahl zurücksetzen
                    }

                    // Prüfen ob das gesamte Bild fertig ist
                    if (correctPixelsCount === totalPixels) {
                        successMsg.style.display = 'block';
                        successMsg.scrollIntoView({ behavior: 'smooth' });
                    }
                } else if (pixel.dataset.filled === "false") {
                    // Kurzer Wackler bei falscher Farbe
                    pixel.style.transform = 'scale(0.85)';
                    setTimeout(() => pixel.style.transform = 'scale(1)', 150);
                }
            };

            gridEl.appendChild(pixel);
        });
    </script>
</body>
</html>
